apiVersion: 1

# Windows 主機安全告警（查 Loki / Alloy 收進來的 Windows Event Log）。
# 用「事件訊息片語」比對（比硬比 Event ID 數字穩、也好懂）；門檻/片語可自行調整。
# 需 Alloy 已把 Security/System/Defender 事件推進 Loki，且帶 job="windows-eventlog" 標籤。
# 落地後可在 Grafana → Explore（Loki）看真實 log 行校正片語。
groups:
  - orgId: 1
    name: security
    folder: Augur Windows
    interval: 1m
    rules:
      - uid: augur-win-failed-logon
        title: WindowsFailedLogonBurst
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Multiple failed Windows logon attempts detected (possible brute force)
          # alertState 到得了 panel 的四個硬前提之一（ADR-004 決策 2）。
          # 缺這兩行的話 props.data.alertState 恆為 undefined，而且**沒有任何錯誤訊息**；
          # rules 端點的第二道註解比對也會把這條規則整個濾掉。
          __dashboardUid__: augur-poc
          __panelId__: "5"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="windows-eventlog"} |= "An account failed to log on" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A > 5'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: augur-win-account-lockout
        title: WindowsAccountLockout
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: A Windows user account was locked out
          # alertState 到得了 panel 的四個硬前提之一（ADR-004 決策 2）。
          # 缺這兩行的話 props.data.alertState 恆為 undefined，而且**沒有任何錯誤訊息**；
          # rules 端點的第二道註解比對也會把這條規則整個濾掉。
          __dashboardUid__: augur-poc
          __panelId__: "5"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="windows-eventlog"} |= "A user account was locked out" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A > 0'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: augur-win-log-cleared
        title: WindowsSecurityLogCleared
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: The Windows security audit log was cleared
          # alertState 到得了 panel 的四個硬前提之一（ADR-004 決策 2）。
          # 缺這兩行的話 props.data.alertState 恆為 undefined，而且**沒有任何錯誤訊息**；
          # rules 端點的第二道註解比對也會把這條規則整個濾掉。
          __dashboardUid__: augur-poc
          __panelId__: "5"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="windows-eventlog"} |= "The audit log was cleared" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A > 0'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: augur-win-service-installed
        title: WindowsServiceInstalled
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: A new service was installed on the Windows host
          # alertState 到得了 panel 的四個硬前提之一（ADR-004 決策 2）。
          # 缺這兩行的話 props.data.alertState 恆為 undefined，而且**沒有任何錯誤訊息**；
          # rules 端點的第二道註解比對也會把這條規則整個濾掉。
          __dashboardUid__: augur-poc
          __panelId__: "5"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="windows-eventlog"} |= "A service was installed in the system" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A > 0'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: augur-win-defender-threat
        title: WindowsDefenderThreat
        condition: B
        for: 0s
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: Windows Defender detected a malware threat
          # alertState 到得了 panel 的四個硬前提之一（ADR-004 決策 2）。
          # 缺這兩行的話 props.data.alertState 恆為 undefined，而且**沒有任何錯誤訊息**；
          # rules 端點的第二道註解比對也會把這條規則整個濾掉。
          __dashboardUid__: augur-poc
          __panelId__: "5"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({job="windows-eventlog", channel=~".*Defender.*"} |~ "(?i)(malware|threat|detected|quarantine)" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A > 0'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
