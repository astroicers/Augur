apiVersion: 1

# Windows 主機效能告警（查 Prometheus / windows_exporter）。
# 每條 rule：A = Prometheus 即時查詢，B = math 門檻（condition）。
# 門檻可自行調整；noData/execErr 設 OK，避免 exporter 還沒裝時狂噴。
groups:
  - orgId: 1
    name: perf
    folder: Augur Windows
    interval: 1m
    rules:
      - uid: augur-win-cpu
        title: WindowsHighCPU
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Windows host CPU usage is high (above 85 percent)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: '100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[5m])) * 100)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A > 85'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: augur-win-mem
        title: WindowsLowMemory
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Windows host available memory is low (below 10 percent)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: 'windows_memory_available_bytes / windows_cs_physical_memory_bytes * 100'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A < 10'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: augur-win-disk
        title: WindowsLowDisk
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Windows host disk free space is low (below 10 percent)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: 'min by (instance, volume) (windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"} / windows_logical_disk_size_bytes * 100)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: '$A < 10'
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
