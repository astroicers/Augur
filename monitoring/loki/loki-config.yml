# Loki 3.x 單機最小設定：檔案儲存、記憶體 ring。只用來收 Windows Event Log 做安全告警。
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Alloy 的 stage.structured_metadata 需要這個。
  allow_structured_metadata: true
  retention_period: 168h   # 7 天

query_range:
  align_queries_with_step: true
