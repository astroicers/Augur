# 事後偵測，**不是門檻**。
#
# 依 user-level 治理紀錄的實查（2026-08-26）：本帳號是 GitHub free 方案，
# 分支保護與 rulesets 都拿不到，所以這個 workflow **無法設為 required**。
# 它買到的是「壞掉時看得見」，不是「壞的推不上來」。驗收文字不要寫成門檻。
#
# node 版本矩陣的理由：repo 裡三處記載不一致 —— `.nvmrc` 寫 24、
# `package.json` 的 engines 寫 `>=22`、實際開發跑的是 22.13。
# 與其挑一個宣稱它是真的，不如兩個都跑；哪天它們真的分岔，這裡會先紅。

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint
        # ⚠️ 覆蓋範圍有洞：`tests/` 與其他 tsconfig project 之外的 .ts **完全不被 lint**
        # （實測 eslint 回「File ignored because no matching configuration was supplied」）。
        # 這一步保護的是 src/ 與 tools/，不是整個 repo。

      - name: .js 副檔名守門
        run: bash tools/check-js-suffix.sh

      - name: monitoring 設定自洽性
        run: node tools/check-monitoring.mjs

      - name: sprite 素材驗收
        run: node tools/check-sprite-sheets.mjs

      - name: sprite 工具自測
        run: node tools/check-sprite-sheets.selftest.mjs

      # 描邊寬度估計器的 20 列計分板。它先前沒有退出碼、也不在任何閘門裡 ——
      # 實測把估計器換成回傳定值的樁，計分板由 19/20 崩到 5/20 而仍然回 0。
      - name: 描邊估計器電池
        run: node tools/stroke-battery.mjs

      # ⚠️ 本機閘門有這道而 CI 先前沒有 —— 於是「PR 把 compose 的 Grafana 版本升上去
      # 但沒動 VERIFIED-GRAFANA.txt」會一路綠燈合併，而 G-ADR004-4（漸進降級，
      # 本專案唯一 unsupported 的部分）根本沒重跑。
      - name: Grafana 版本觸發器
        run: |
          # ⚠️ 這條樣式必須與 tools/asp-test.sh 的那條**逐字相同**。
          # 先前 CI 是 `"?grafana/grafana:` 而本機已經放寬成認單引號與 registry 前綴，
          # 於是 `image: 'grafana/grafana:13.2.2'`（本 repo 的 YAML house style）或
          # `image: docker.io/grafana/grafana:13.2.2` 會**本機綠、CI 紅**，
          # 而 CI 印的是「有 0 個未註解的 grafana image 宣告」—— 一句對著檔案看就知道
          # 是假的話。護欄講假話是它被整條關掉的最短路徑。
          LINES=$(grep -nE "^[[:space:]]*image:[[:space:]]*[\"']?([a-z0-9.:-]+/)*grafana/grafana:" monitoring/docker-compose.yml || true)
          COUNT=$(printf '%s' "$LINES" | grep -c . || true)
          TAG=$(printf '%s' "$LINES" | head -1 | sed -E 's/.*grafana\/grafana:([0-9][0-9.]*).*/\1/')
          VERIFIED=$(head -1 monitoring/VERIFIED-GRAFANA.txt | tr -d '[:space:]')
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::monitoring/docker-compose.yml 有 $COUNT 個未註解的 grafana image 宣告"; exit 1
          fi
          if [ "$TAG" != "$VERIFIED" ]; then
            echo "::error::Grafana 由 $VERIFIED 變成 $TAG，需重跑 G-ADR004-4 並更新 monitoring/VERIFIED-GRAFANA.txt"; exit 1
          fi
          echo "grafana $TAG（與 G-ADR004-4 通過時相同）"

      - name: 單元測試
        run: npm run test:unit

      # ⚠️ **build 不能省。** 本 repo 有整整一段文件在講「只有 build 會炸、
      # typecheck 永遠綠」的失敗模式（相對 import 帶 .js 後綴）。同類的還有
      # SP-8.3 的 WebP 陷阱（typecheck 過、bundle 爆）與未來 spriteAssets.ts 的
      # 兩行 png import。CI 不跑 build 等於把最會出事的一關留在外面。
      - name: build
        run: npm run build

      # ⚠️ 本機閘門有這道而 CI 先前沒有 —— 本機九道、CI 八道，而兩份文件
      # （README:17、sprite-sheet-spec.md:931-933）都寫「commit 閘共 9 道」，
      # 缺的正是這一道。後果：把第三方套件打包進出貨 bundle 的 PR 在 CI 一路綠燈。
      # **必須排在 build 之後** —— 它稽核的是 dist/module.js.map，
      # CI 的工作樹沒有 dist，排在前面只會拿到 NOT-BUILT 並回 0（等於沒跑）。
      - name: bundle 相依
        run: node tools/check-bundle-deps.mjs

  # e2e：真的把 compose 環境起起來、把 plugin 掛進 Grafana、用瀏覽器驗
  # G-ADR004-1（plugin 載入）與 G-ADR004-2（告警走完導播管線）。
  # 這是唯一能抓到「掛載空了 / 容器沒重掃 plugin」那類環境級失效的檢查 ——
  # 2026-09-28 實地發生過一次（e2e 2 failed 而 npm run server 照樣 exit 0），
  # 當時 CI 完全沒有這一層。單獨一個 job、不進 node 版本矩陣：它驗的是
  # 環境接線不是程式碼相容性，跑兩份只會多付一倍鏡像拉取時間。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 產 CI 專用的 monitoring/.env
        # compose 宣告 env_file: ./.env，檔案缺席是 fatal。本機的 .env 不進版控
        # （裡面是真密碼），CI 用固定的 admin/admin —— plugin-e2e 的預設憑證。
        run: printf 'GF_ADMIN_USER=admin\nGF_ADMIN_PASSWORD=admin\n' > monitoring/.env
      - run: docker compose -f monitoring/docker-compose.yml up -d
      - name: 等 plugin 真的註冊進 Grafana
        run: bash tools/check-server.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: 失敗時傾印 Grafana 日誌
        if: failure()
        run: docker logs augur-grafana 2>&1 | tail -120
