# ⚠️ 由 `asp render ci` 產生 — 勿手改(單一事實源:asp-gate.yaml)
name: asp-ci
on:
  pull_request:
    branches: [main]
  merge_group: {}  # merge queue rebase 後重跑
permissions: read-all  # PR job 零 secrets(ADR-000 §7 兩段式)
jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # commit-format 需非 merge commit 歷史(PR ref 為合成 merge)
      - name: ensure gitleaks（checksum-pinned vendoring;#631)
        run: |
          d="$HOME/.asp/tools"; b="$d/gitleaks-v8.30.1"
          if [ ! -x "$b" ]; then
            mkdir -p "$d"
            curl -sSL -o "$b.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $b.tgz" | sha256sum -c -
            tar -xzOf "$b.tgz" gitleaks > "$b.tmp"
            chmod +x "$b.tmp" && mv "$b.tmp" "$b"
            rm -f "$b.tgz"
          fi
          ln -sf "$b" "$d/gitleaks"
          echo "$d" >> "$GITHUB_PATH"
      - name: gate(committed 渲染物,與本地同一份 → 判定一致)
        run: bash .asp/gate.sh
      - name: ci 檢查(committed 渲染物;清單住 .asp/ci.sh,不住本檔)
        run: bash .asp/ci.sh
  megalinter:
    runs-on: ubuntu-latest
    steps:
      - name: clean root-owned leftovers（自架:前一輪 MegaLinter 容器留的 root 檔,具名清單,#453）
        run: |
          # best-effort(#712):失敗處理包住整條 docker run,不是包它的
          # 參數字串——會死的是外層(憑證/映像/daemon),不只容器內的 rm。
          rc=0
          docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:latest sh -c 'rm -rf /w/.megalinter-work /w/megalinter-reports /w/.ruff_cache /w/.mypy_cache' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "✅ 清理完成(沒有殘留可清時亦然)"
            exit 0
          fi
          # 不擋,但說話:退出碼與成因都要留在 job 輸出裡。
          echo "::warning::清理沒跑成(docker run 退出碼 $rc;成因見上方 docker 的輸出,常見:憑證解析失敗、映像拉不到、daemon 不在)——清理不是閘,不擋"
          left=''
          for p in .megalinter-work megalinter-reports .ruff_cache .mypy_cache; do
            if [ -e "$GITHUB_WORKSPACE/$p" ]; then left="$left $p"; fi
          done
          if [ -n "$left" ]; then
            echo "::warning::殘留仍在:$left(工作卷 $GITHUB_WORKSPACE)"
          else
            echo "本輪沒有殘留可清——清理沒跑成,無後果"
          fi
          exit 0
      - name: 斷言工作卷沒有 root 殘留(清理是 best-effort,這一步才是閘;#712)
        run: |
          bad=''
          for p in .megalinter-work megalinter-reports .ruff_cache .mypy_cache; do
            t="$GITHUB_WORKSPACE/$p"
            [ -e "$t" ] || continue
            if [ -n "$(find "$t" ! -uid "$(id -u)" -print -quit 2>/dev/null)" ]; then
              bad="$bad $p"
            else
              echo "$p 仍在,但屬於當前使用者——checkout 的 git clean 清得掉,不擋"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::工作卷有 root 擁有的殘留,後續步驟會撞上它(checkout 會 EACCES):$bad"
            echo "成因:前一步的 best-effort 清理沒跑成(見它的 warning)。處置:修復該 runner 的 docker 後重跑,或以 root 刪除上列路徑。"
            exit 1
          fi
          echo "✅ 工作卷無 root 殘留"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: MegaLinter（需 docker）
        uses: oxsecurity/megalinter/flavors/python@15e5b45552097e318c93de385779ce3b1084052c  # v10.0.0
