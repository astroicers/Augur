name: Bug(缺陷)
description: 缺陷回報;附重現步驟與連結
labels: ["type:bug"]
body:
  - type: textarea
    id: repro
    attributes: {label: 重現步驟, placeholder: "1. …\n2. …\n預期 vs 實際"}
    validations: {required: true}
  - type: textarea
    id: ac
    attributes:
      label: 驗收準則(Given/When/Then)
      description: 每條含可觀察結果;修復以重現測試轉綠為準
      placeholder: "Given …\nWhen …\nThen …"
    validations: {required: true}
  - type: textarea
    id: depends-on
    attributes:
      label: 依賴(depends-on)
      description: |
        每個依賴一行,整行就是 `depends-on: #N`(N 是本 repo 的票號);沒有依賴就留空。
        runtime 只認這一個格式(逐行比對 `^\s*depends-on:\s*#(\d+)`,不分大小寫):
        有命中就把這張票判成 blocked,等 #N 合併後才派工。
        寫成「依賴 #69」或只寫「#69」**不會**被認得,票會照常派工(見 #70 → PR #75 的事故)。
        留空時 GitHub 會在本欄標題下寫 `_No response_`,那不算依賴,不必當成填錯。
      placeholder: "depends-on: #69"
  - type: input
    id: links
    attributes: {label: 相關 PR / commit / session}
  - type: dropdown
    id: defect-class
    attributes: {label: defect-class(triage 時定), options: ["instance", "class", "structural", "未定"]}
