name: Bug(缺陷)
description: 缺陷回報;附重現步驟與連結
labels: ["type:bug"]
body:
  - type: textarea
    id: repro
    attributes: {label: 重現步驟, placeholder: "1. …\n2. …\n預期 vs 實際"}
    validations: {required: true}
  - type: textarea
    id: ac
    attributes:
      label: 驗收準則(Given/When/Then)
      description: 每條含可觀察結果;修復以重現測試轉綠為準
      placeholder: "Given …\nWhen …\nThen …"
    validations: {required: true}
  - type: textarea
    id: depends-on
    attributes:
      label: 依賴(depends-on)
      description: >-
        每個依賴一行 `depends-on: #N`(N 是本 repo 的票號);沒有依賴就留空。
        runtime 只認「整行以 depends-on: #N 開頭」的那一行:寫成「依賴 #69」或只寫 `#69` 不會被認得。
        不要在那一行前面加 `-`、`*`、`1.`、`>` 等項目符號或引用符號——整行必須以 `depends-on:` 起頭,加了會靜默不命中、runtime 當成沒有依賴照常派工;純縮排的空白不影響。
      placeholder: "depends-on: #69"
  - type: input
    id: links
    attributes: {label: 相關 PR / commit / session}
  - type: dropdown
    id: defect-class
    attributes: {label: defect-class(triage 時定), options: ["instance", "class", "structural", "未定"]}
