name: Task(工作項)
description: 已成形的工作項;AC 必填 Given/When/Then
labels: ["type:task"]
body:
  - type: textarea
    id: background
    attributes: {label: 背景, description: 為什麼要做;引用檔案路徑與章節名}
    validations: {required: true}
  - type: textarea
    id: ac
    attributes:
      label: 驗收準則(Given/When/Then)
      description: 每條含可觀察結果(測試名、命令輸出、檔案內容)
      placeholder: "AC-1:Given …,When …,Then …"
    validations: {required: true}
  - type: textarea
    id: depends-on
    attributes:
      label: 依賴(depends-on)
      description: >-
        每個依賴一行 `depends-on: #N`(N 是本 repo 的票號);沒有依賴就留空。
        runtime 只認「整行以 depends-on: #N 開頭」的那一行:寫成「依賴 #69」或只寫 `#69` 不會被認得。
        不要在那一行前面加 `-`、`*`、`1.`、`>` 等項目符號或引用符號——整行必須以 `depends-on:` 起頭,加了會靜默不命中、runtime 當成沒有依賴照常派工;純縮排的空白不影響。
      placeholder: "depends-on: #69"
  - type: input
    id: links
    attributes: {label: 相關 issue / PR / 文件}
